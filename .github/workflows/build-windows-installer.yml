name: Build Windows Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: "cairn-memory version the installer pins (X.Y.Z)"
        required: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Prepare embedded Python
        working-directory: installer
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path build\python | Out-Null
          Invoke-WebRequest -Uri "https://www.python.org/ftp/python/3.12.8/python-3.12.8-embed-amd64.zip" -OutFile build\python.zip
          Expand-Archive build\python.zip -DestinationPath build\python -Force
          Remove-Item build\python.zip
          Invoke-WebRequest -Uri "https://bootstrap.pypa.io/get-pip.py" -OutFile build\get-pip.py

      - name: Resolve version
        id: ver
        shell: powershell
        run: |
          if ("${{ github.ref }}".StartsWith("refs/tags/v")) {
            $v = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $v = "${{ inputs.version }}"
          }
          if (-not $v) { Write-Error "No version resolved"; exit 1 }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Installer will pin cairn-memory[server]==$v"

      - name: Build installer
        working-directory: installer
        shell: powershell
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ steps.ver.outputs.version }} cairn-setup.iss'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cairn-Memory-${{ steps.ver.outputs.version }}-Windows
          path: installer/dist/cairn-setup.exe

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/dist/cairn-setup.exe
