name: Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,server]"

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/cairn/models/gte-modernbert-base-onnx
          key: gte-modernbert-base-onnx

      - name: Download embedding model
        run: |
          MODEL_DIR=~/.cache/cairn/models/gte-modernbert-base-onnx
          if [ ! -f "$MODEL_DIR/model.onnx" ]; then
            mkdir -p "$MODEL_DIR"
            HF=https://huggingface.co/Alibaba-NLP/gte-modernbert-base/resolve/main
            curl -fsSL "$HF/onnx/model.onnx" -o "$MODEL_DIR/model.onnx"
            curl -fsSL "$HF/tokenizer.json" -o "$MODEL_DIR/tokenizer.json"
            curl -fsSL "$HF/tokenizer_config.json" -o "$MODEL_DIR/tokenizer_config.json"
            curl -fsSL "$HF/config.json" -o "$MODEL_DIR/config.json"
          fi
          # Sidecar: gte is CLS-pooled; without this the loader would fall
          # back to legacy mean pooling and silently degrade every embedding.
          printf '%s' '{"model_name": "gte-modernbert-base", "model_version": "v1", "dim": 768, "pooling": "cls", "output_name": null, "query_prefix": "", "doc_prefix": "", "max_length": 512, "pad_id": 50283, "pad_token": "[PAD]"}' > "$MODEL_DIR/cairn.json"

      - name: Lint
        run: ruff check src/

      - name: Test
        # No -x: run the whole suite so one failure doesn't mask others.
        # Coverage is reported (not gated yet) to establish a baseline.
        env:
          CAIRN_EMBED_IDLE_TIMEOUT_S: "86400"
        run: pytest tests/ --tb=short --cov=cairn --cov-report=term-missing

      - name: Test (randomized order)
        # Surfaces order-dependencies / leaky global state (e.g. the bridge
        # store singleton). Non-blocking until the fixtures are hardened.
        continue-on-error: true
        run: pytest tests/ -p randomly --tb=line -q
