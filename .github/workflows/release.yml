name: Release

# Tag-driven release: on a v* tag, build the wheel + sdist, publish to PyPI via
# trusted publishing (OIDC — no API token stored), and create/attach to the
# GitHub Release. The installer workflows (build-macos/windows-installer.yml)
# also fire on v* and attach their .pkg/.exe to the SAME release.
#
# One-time PyPI setup (owner): pypi.org/manage/project/cairn-memory → Publishing →
# add a GitHub trusted publisher: repo KalebKE/cairn, workflow release.yml, project cairn-memory,
# environment "pypi". Until that exists, the publish step will fail (nothing
# leaks). To use an API token instead, replace the publish step with
# `password: ${{ secrets.PYPI_API_TOKEN }}` and drop the id-token permission.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # The release used to publish without running anything — v2.1.1 shipped
  # straight through a red main. One gate cell (ubuntu, 3.12, the calibrated
  # embedder) so a broken build can't reach PyPI.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,server]"

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/cairn/models/gte-modernbert-base-onnx
          key: gte-modernbert-base-onnx

      - name: Download embedding model
        run: |
          MODEL_DIR=~/.cache/cairn/models/gte-modernbert-base-onnx
          if [ ! -f "$MODEL_DIR/model.onnx" ]; then
            mkdir -p "$MODEL_DIR"
            HF=https://huggingface.co/Alibaba-NLP/gte-modernbert-base/resolve/main
            curl -fsSL "$HF/onnx/model.onnx" -o "$MODEL_DIR/model.onnx"
            curl -fsSL "$HF/tokenizer.json" -o "$MODEL_DIR/tokenizer.json"
            curl -fsSL "$HF/tokenizer_config.json" -o "$MODEL_DIR/tokenizer_config.json"
            curl -fsSL "$HF/config.json" -o "$MODEL_DIR/config.json"
          fi
          printf '%s' '{"model_name": "gte-modernbert-base", "model_version": "v1", "dim": 768, "pooling": "cls", "output_name": null, "query_prefix": "", "doc_prefix": "", "max_length": 512, "pad_id": 50283, "pad_token": "[PAD]"}' > "$MODEL_DIR/cairn.json"

      - name: Test
        env:
          CAIRN_EMBED_IDLE_TIMEOUT_S: "86400"
        run: pytest tests/ --tb=short

  release:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC for PyPI trusted publishing
      contents: write # create/attach the GitHub release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel + sdist
        run: |
          python -m pip install --upgrade build
          python -m build --wheel --sdist

      - name: Verify package version matches the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          # src layout: the package must be installed before it can be
          # imported — verify the actual built wheel, not the checkout.
          python -m pip install --quiet dist/*.whl
          PKG=$(python -c "import cairn, sys; sys.stdout.write(cairn.__version__)")
          echo "tag=$TAG package=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package version $PKG"
            exit 1
          fi

      - name: Extract changelog section for release notes
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          awk -v v="$TAG" '
            $0 ~ "^## \\[" v "\\]" {grab=1; next}
            grab && /^## \[/ {exit}
            grab {print}
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then echo "Release $TAG" > RELEASE_NOTES.md; fi
          cat RELEASE_NOTES.md

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create/attach GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            dist/*.whl
            dist/*.tar.gz
